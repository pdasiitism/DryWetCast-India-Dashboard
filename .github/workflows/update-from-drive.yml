name: Update forecast from Google Drive

on:
  workflow_dispatch:
  schedule:
    # Primary daily attempt at 4:00 PM IST (10:30 UTC), followed by
    # half-hourly retries from 4:30 PM through 8:00 PM IST. Incomplete
    # uploads are never published.
    - cron: '30 10 * * *'
    - cron: '0,30 11-14 * * *'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      DRIVE_PARENT_FOLDER_ID: '1zGAcTf_kovWZvKlI1j2ud9Hrx207Sv04'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dashboard dependencies
        run: pip install -r requirements.txt

      - name: Cache validated IMD rainfall downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/imdlib
          key: imd-rainfall-v1-${{ github.run_id }}
          restore-keys: imd-rainfall-v1-

      - name: Restore last successfully published results
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/preserve_dashboard.py restore
          --repository "${{ github.repository }}"
          --site-dir site

      - name: Download and validate latest complete forecast
        run: >-
          python scripts/update_dashboard.py
          --parent-folder-id "$DRIVE_PARENT_FOLDER_ID"
          --site-dir site
          --boundaries data/india_states.geojson

      - name: Verify complete forecasts against provisional IMD rainfall
        run: >-
          python scripts/preserve_dashboard.py refresh --site-dir site --
          python scripts/update_verification.py
          --parent-folder-id "$DRIVE_PARENT_FOLDER_ID"
          --start-date 20261015

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 30

      - name: Deploy updated dashboard
        id: deployment
        uses: actions/deploy-pages@v4

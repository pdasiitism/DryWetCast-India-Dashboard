name: Update forecast from Google Drive

on:
  workflow_dispatch:
  schedule:
    # Repeated evening checks in India. GitHub schedules may start late, so
    # several attempts are used; incomplete uploads are never published.
    - cron: '30 10 * * *'
    - cron: '0,30 11-17 * * *'
    - cron: '0 18 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      DRIVE_PARENT_FOLDER_ID: '1zGAcTf_kovWZvKlI1j2ud9Hrx207Sv04'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dashboard dependencies
        run: pip install -r requirements.txt

      - name: Download and validate latest complete forecast
        run: >-
          python scripts/update_dashboard.py
          --parent-folder-id "$DRIVE_PARENT_FOLDER_ID"
          --site-dir site
          --boundaries data/india_states.geojson

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy updated dashboard
        id: deployment
        uses: actions/deploy-pages@v4

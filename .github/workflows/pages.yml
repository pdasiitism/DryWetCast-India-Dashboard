name: Publish dashboard

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      verification_ref:
        description: Commit containing a rebuilt verification snapshot
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve published results when updating the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/preserve_dashboard.py restore
          --repository "${{ github.repository }}"
          --site-dir site
      - name: Read rebuilt verification snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_ref != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.verification_ref }}
          path: rebuilt-verification
          persist-credentials: false
      - name: Validate and apply rebuilt verification snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_ref != '' }}
        run: >-
          python scripts/preserve_dashboard.py import
          --site-dir site
          --snapshot rebuilt-verification/site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 30
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

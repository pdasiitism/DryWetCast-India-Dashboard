name: Publish dashboard

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve published results when updating the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/preserve_dashboard.py restore
          --repository "${{ github.repository }}"
          --site-dir site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 30
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
